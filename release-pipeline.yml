# Docker
# Build and push an image to Azure Container Registry
# https://docs.microsoft.com/azure/devops/pipelines/languages/docker

trigger:
- master


variables:
  # Container registry service connection established during pipeline creation
  dockerRegistryServiceConnection: '420902d6-104b-40e2-8092-5216d03fae95'
  imageRepository: 'apireceitas'
  containerRegistry: 'michelmyrecipebookregister.azurecr.io'
  dockerfilePath: 'Dockerfile'
  tag: '$(Build.BuildId)'

pool:
      vmImage: 'ubuntu-latest'


steps:
  - task: DownloadSecureFile@1
    displayName: Download appsettings
    name: appsettings
    inputs:
      secureFile: 'appsettings.Production.json'

  - script: |
      cp $(appsettings.secureFilePath) src/Backend/MyRecipeBook.API

  - task: Docker@2
    displayName: Build and push an image to container registry
    inputs:
      command: buildAndPush
      repository: $(imageRepository)
      dockerfile: $(dockerfilePath)
      containerRegistry: $(dockerRegistryServiceConnection)
      tags: |
        latest
        $(tag)
